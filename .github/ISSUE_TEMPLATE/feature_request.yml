name: Feature request
description: Suggest an Interlock product or developer-experience improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What developer or agent-safety problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Product surface
      options:
        - SDK
        - REST API
        - CLI
        - MCP
        - Dashboard
        - Contracts
        - Docs
        - Other
    validations:
      required: true
