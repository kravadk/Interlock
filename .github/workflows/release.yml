name: release-check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/**"
      - ".changeset/**"
      - "scripts/release-*.mjs"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:changeset:check
        env:
          CHANGESET_SINCE: origin/main
      - run: pnpm release:check
