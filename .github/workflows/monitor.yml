name: monitor

# Scheduled drift watch for the live Mantle Sepolia deployment. Runs the existing
# verification scripts against the on-chain contracts; if any fail, opens (or reuses)
# a single tracking issue so deployment/health regressions surface automatically.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      - name: Live deployment verify
        run: pnpm live:verify
        env:
          MANTLE_RPC_URL: ${{ secrets.MANTLE_RPC_URL }}

      - name: Contract verification status
        run: pnpm contracts:verification-status
        env:
          MANTLE_RPC_URL: ${{ secrets.MANTLE_RPC_URL }}

      - name: Submission doctor (live)
        run: pnpm submission:doctor:live
        env:
          MANTLE_RPC_URL: ${{ secrets.MANTLE_RPC_URL }}

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "🚨 Live deployment monitor failed";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The scheduled \`monitor\` workflow failed.\n\nRun: ${run}\n\nA verification step (live:verify / contracts:verification-status / submission:doctor:live) reported a problem with the Mantle Sepolia deployment. Investigate the run log above.`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "monitor",
            });
            const open = existing.data.find((i) => i.title === title);
            if (open) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["monitor"],
              });
            }
